<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipboard Regex Processor 設定</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="settings-page">
    <h1>正規表現設定</h1>
    <p class="muted">上から順番に適用されます。正規表現はJavaScript形式で指定してください。</p>

    <section class="editor-card">
      <h2 id="editor-title">正規表現を追加</h2>

      <label>
        名前
        <input id="regex-name" type="text" placeholder="例: 連続空行を1つにする">
      </label>

      <label>
        正規表現
        <input id="regex-pattern" type="text" placeholder="例: \\n{3,}">
      </label>

      <label>
        置換文字列
        <textarea id="regex-replacement" rows="3" placeholder="例: \\n\\n"></textarea>
      </label>

      <label>
        フラグ
        <input id="regex-flags" type="text" value="g" placeholder="例: gim">
      </label>

      <div class="actions">
        <button id="save-regex" type="button">追加</button>
        <button id="cancel-edit" class="secondary" type="button" hidden>編集をキャンセル</button>
      </div>
      <p id="editor-status" class="status" role="status"></p>
    </section>

    <section>
      <h2>登録済み正規表現</h2>
      <div id="saved-regex-list" class="regex-cards"></div>
      <p id="options-empty-message" class="muted" hidden>まだ正規表現が登録されていません。</p>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
